<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LinkGlow</title>
<style>
  :root {
    --bg: #FAF7F4;
    --surface: #FFFFFF;
    --sunk: #F3EEE9;
    --ink: #1F1B18;
    --ink-2: #4A433E;
    --muted: #8C837C;
    --line: #E9E2DB;
    --blush: #F6E1DA;
    --blush-ink: #9B4F43;
    --rose: #D98A7C;
    --sage: #E3EBDF;
    --sage-ink: #4E6B47;
    --sky: #E1E8F0;
    --sky-ink: #3F5A78;
    --butter: #F6EED6;
    --butter-ink: #806624;
    --danger: #B4473A;
    --r-sm: 10px;
    --r: 16px;
    --r-lg: 22px;
    --shadow: 0 1px 2px rgba(31,27,24,.04), 0 6px 24px rgba(31,27,24,.05);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    font-family: "Inter", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body { font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  /* Layout */
  .shell { max-width: 1180px; margin: 0 auto; padding: 0 16px 32px; }
  .foot { text-align: center; padding: 0 16px 40px; color: var(--muted); font-size: 12px; }
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: rgba(250,247,244,.88); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line); padding-top: var(--safe-t);
  }
  .top-inner { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.02em; font-size: 19px; }
  .logo-dot { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0 18%, var(--blush) 40%, var(--rose) 100%); box-shadow: 0 0 0 4px rgba(246,225,218,.6); }
  .logo small { font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: 0; }
  .spacer { flex: 1; }

  .seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .seg.sm button { padding: 5px 10px; font-size: 12px; }

  nav.tabs { display: flex; gap: 4px; margin: 20px 0 8px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { border: 0; background: none; padding: 10px 14px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  nav.tabs button.on { color: var(--ink); border-color: var(--ink); }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--rose); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-weight: 700; }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 22px 0 18px; flex-wrap: wrap; }
  h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.03em; margin: 0; font-weight: 700; }
  h2 { font-size: 18px; letter-spacing: -.01em; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 0; }
  .sub { color: var(--muted); margin: 6px 0 0; font-size: 14px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
  .pad { padding: 20px; }
  .grid { display: grid; gap: 14px; }
  .grid.cards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .grid.two { grid-template-columns: 1.4fr 1fr; align-items: start; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .stack > * + * { margin-top: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .xs { font-size: 12px; }
  .strong { font-weight: 650; }
  .num { font-variant-numeric: tabular-nums; }
  hr.soft { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

  /* Buttons */
  .btn { border: 1px solid transparent; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .08s ease, background .15s ease, opacity .15s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.primary:hover { background: #3a332e; }
  .btn.blush { background: var(--blush); color: var(--blush-ink); }
  .btn.blush:hover { background: #F1D3C9; }
  .btn.ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .btn.ghost:hover { background: var(--sunk); }
  .btn.sm { padding: 7px 13px; font-size: 13px; }
  .btn.block { width: 100%; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .link { background: none; border: 0; padding: 0; color: var(--blush-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  /* Chips & tags */
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
  .tag.blush { background: var(--blush); color: var(--blush-ink); }
  .tag.sage { background: var(--sage); color: var(--sage-ink); }
  .tag.sky { background: var(--sky); color: var(--sky-ink); }
  .tag.butter { background: var(--butter); color: var(--butter-ink); }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Forms */
  label.f { display: block; }
  label.f > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink-2); }
  .input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 11px 13px; outline: none; transition: border-color .15s, box-shadow .15s; font-size: 15px; }
  .input:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(217,138,124,.15); }
  textarea.input { min-height: 88px; resize: vertical; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .opt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .opt { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; background: var(--surface); text-align: left; }
  .opt.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: #FFFDFB; }
  .opt b { display: block; font-size: 14px; }
  .opt small { color: var(--muted); font-size: 12px; }
  .err { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
  .check input { margin-top: 3px; accent-color: var(--ink); width: 16px; height: 16px; flex: none; }

  /* Filters bar */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 16px; }
  .filters .input { width: auto; padding: 8px 12px; font-size: 14px; }
  .filters .search { flex: 1 1 200px; }

  /* Creator card */
  .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--ink-2); flex: none; font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0; }
  .stat { background: var(--sunk); border-radius: var(--r-sm); padding: 8px 10px; }
  .stat b { display: block; font-size: 16px; letter-spacing: -.01em; }
  .stat span { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  /* Campaign card */
  .product-art { height: 120px; border-radius: var(--r-sm); position: relative; overflow: hidden; display: grid; place-items: center; margin-bottom: 14px; }
  .bottle { width: 34px; height: 74px; border-radius: 10px 10px 8px 8px; background: rgba(255,255,255,.85); position: relative; box-shadow: 0 8px 18px rgba(0,0,0,.06); }
  .bottle::before { content: ""; position: absolute; top: -14px; left: 9px; width: 16px; height: 16px; border-radius: 4px 4px 0 0; background: rgba(31,27,24,.75); }
  .bottle.tube { width: 40px; height: 82px; border-radius: 6px 6px 18px 18px; }
  .bottle.tube::before { top: auto; bottom: -10px; left: 12px; width: 16px; height: 12px; border-radius: 0 0 4px 4px; }
  .bottle.device { width: 26px; height: 92px; border-radius: 14px; background: rgba(255,255,255,.92); }
  .bottle.device::before { top: 10px; left: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 12px 3px rgba(217,138,124,.6); }
  .comp { font-size: 13px; font-weight: 650; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }

  /* Pipeline */
  .stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 16px 0 6px; }
  .step { position: relative; text-align: center; font-size: 12px; color: var(--muted); padding-top: 26px; font-weight: 600; }
  .step::before { content: ""; position: absolute; top: 9px; left: 0; right: 0; height: 2px; background: var(--line); }
  .step:first-child::before { left: 50%; }
  .step:last-child::before { right: 50%; }
  .step i { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); z-index: 1; }
  .step.done { color: var(--ink-2); }
  .step.done::before { background: var(--ink); }
  .step.done i { background: var(--ink); border-color: var(--ink); }
  .step.now { color: var(--ink); }
  .step.now i { border-color: var(--rose); background: var(--blush); box-shadow: 0 0 0 4px rgba(246,225,218,.8); }
  .step.now::before { background: linear-gradient(90deg, var(--ink) 50%, var(--line) 50%); }
  .step:first-child.now::before { background: var(--line); }
  .callout { border-radius: var(--r-sm); padding: 12px 14px; font-size: 14px; }
  .callout.blush { background: var(--blush); color: var(--blush-ink); }
  .callout.sage { background: var(--sage); color: var(--sage-ink); }
  .callout.sky { background: var(--sky); color: var(--sky-ink); }
  .callout.butter { background: var(--butter); color: var(--butter-ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }

  /* Applicant rows */
  .applicant { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .applicant:first-child { border-top: 0; }
  .applicant .grow { flex: 1 1 160px; min-width: 0; }

  /* Analytics */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi { padding: 16px 18px; }
  .kpi span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .kpi b { display: block; font-size: 26px; letter-spacing: -.03em; margin-top: 2px; }
  .kpi em { font-style: normal; font-size: 12px; color: var(--sage-ink); font-weight: 600; }
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 64px; align-items: center; gap: 10px; font-size: 13px; }
  .bar-track { height: 10px; background: var(--sunk); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--rose); border-radius: 6px; }
  .bar-fill.ink { background: var(--ink-2); }
  .table-wrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px; }
  table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t td.r, table.t th.r { text-align: right; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* Empty state */
  .empty { text-align: center; padding: 44px 20px; color: var(--muted); }
  .empty .ring { width: 56px; height: 56px; border-radius: 50%; background: var(--blush); margin: 0 auto 12px; }

  /* Modal */
  .scrim { position: fixed; inset: 0; background: rgba(31,27,24,.36); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .18s ease; }
  .modal { background: var(--surface); width: 100%; max-width: 640px; max-height: calc(100vh - 32px); border-radius: var(--r-lg); display: flex; flex-direction: column; overflow: hidden; animation: rise .22s ease; }
  .modal-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
  .modal-body { padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .modal-foot { padding: 14px 20px calc(14px + var(--safe-b)); border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; background: var(--bg); }
  .x { border: 0; background: var(--sunk); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1; flex: none; }
  .contract { background: #FFFDFB; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 18px; font-size: 13.5px; line-height: 1.6; }
  .contract h4 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--blush-ink); }
  .contract h4:first-child { margin-top: 0; }
  .contract ol, .contract ul { margin: 0; padding-left: 18px; }
  .contract li + li { margin-top: 4px; }
  .ftc-live { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-top: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
  .dot.ok { background: var(--sage-ink); }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: calc(92px + var(--safe-b)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.18); animation: rise .2s ease; max-width: calc(100vw - 32px); text-align: center; }

  /* Profiles, feed, comments */
  img.avatar { display: block; object-fit: cover; padding: 0; }
  .av-btn { background: none; border: 0; padding: 0; border-radius: 50%; flex: none; }
  .link-plain { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; }
  .link-plain.strong { font-weight: 650; }
  .link-plain:hover { text-decoration: underline; text-underline-offset: 3px; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .feed { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 640px; margin: 0 auto; }
  .post { padding: 18px; }
  .post-cap { margin: 12px 0; font-size: 15px; white-space: pre-line; }
  .post .product-art { height: 170px; margin-bottom: 10px; }
  .post-metrics { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: 0 0 12px; flex-wrap: wrap; }
  .post-metrics b { color: var(--ink); }
  .note { background: var(--butter); border-radius: var(--r-sm); padding: 12px 14px; margin-bottom: 12px; color: var(--ink-2); }
  .note p { margin: 6px 0 8px; font-size: 14px; }
  .stars { color: #C29A2E; letter-spacing: 1px; font-size: 14px; }
  .react { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .react.on { background: var(--blush); color: var(--blush-ink); border-color: transparent; }
  .comments { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; display: grid; gap: 10px; }
  .comment { display: flex; gap: 8px; font-size: 14px; align-items: flex-start; }
  .comment .bubble { background: var(--sunk); border-radius: 14px; padding: 8px 12px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .comment-form { display: flex; gap: 8px; margin-top: 12px; }
  .comment-form .input { padding: 9px 12px; font-size: 14px; }
  .profile-hero { display: flex; gap: 16px; align-items: center; }
  .rate { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .rate:first-child { border-top: 0; }
  .pkg-row { display: grid; grid-template-columns: 1fr 110px 36px; gap: 8px; align-items: center; }
  .star-pick { display: flex; gap: 2px; }
  .star-pick button { font-size: 30px; line-height: 1; background: none; border: 0; color: var(--line); padding: 0 2px; }
  .star-pick button.on { color: #C29A2E; }
  .photo-up { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .pitch { border-top: 1px solid var(--line); padding: 14px 0; }
  .pitch:first-child { border-top: 0; padding-top: 0; }
  .quote { border-left: 3px solid var(--blush); padding: 2px 0 2px 12px; margin: 8px 0; color: var(--ink-2); font-size: 14px; }

  .acct { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px 3px 3px; font-size: 13px; font-weight: 600; max-width: 200px; }
  .acct span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph { width: 100%; aspect-ratio: 4 / 5; border-radius: var(--r-sm); object-fit: cover; display: block; margin-bottom: 10px; }
  .ph.art { display: grid; align-items: end; padding: 16px; position: relative; overflow: hidden; }
  .ph.art::before { content: ""; position: absolute; width: 46%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.45); top: 16%; right: 12%; }
  .ph.art span { position: relative; font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: rgba(31,27,24,.78); }
  .ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 16px; }
  .ig-grid button { padding: 0; border: 0; background: none; border-radius: 6px; overflow: hidden; }
  .ig-grid .ph { aspect-ratio: 1; border-radius: 6px; margin: 0; }
  .ig-grid .ph.art { padding: 8px; }
  .ig-grid .ph.art span { font-size: 11px; }
  .composer { display: flex; gap: 12px; align-items: center; padding: 14px 16px; }
  .composer .fake { flex: 1; text-align: left; border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 10px 16px; color: var(--muted); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drop { border: 1.5px dashed var(--line); border-radius: var(--r-sm); aspect-ratio: 4 / 5; max-height: 340px; display: grid; place-items: center; color: var(--muted); font-size: 14px; background: var(--sunk); margin: 0 auto; width: 100%; }
  .hash { color: var(--sky-ink); font-weight: 600; }
  .acct-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 8px; border: 0; background: none; border-radius: var(--r-sm); text-align: left; }
  .acct-row:hover { background: var(--sunk); }

  .dots { border: 0; background: none; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; line-height: 1; color: var(--muted); flex: none; }
  .dots:hover { background: var(--sunk); color: var(--ink); }
  .comment .dots { width: 24px; height: 24px; font-size: 15px; }
  .hidden-note { background: var(--sunk); border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 8px 12px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .is-hidden { opacity: .55; }
  .sheet-btn { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 14px 8px; font-size: 15px; font-weight: 600; border-top: 1px solid var(--line); }
  .sheet-btn:first-child { border-top: 0; }
  .sheet-btn.danger { color: var(--danger); }
  .logo-btn { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  .mod-row { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: flex-start; flex-wrap: wrap; }

  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); return true; } catch (e) { return false; }

function daysLeft(d) {
  if (!d) return '';
  const diff = Math.ceil((new Date(d + 'T23:59:59') - new Date()) / 86400000);
  return diff < 0 ? 'Closed' : diff === 0 ? 'Closes today' : `${diff}d left`;
}

// Deterministic pseudo-random per string, so mock analytics stay stable between renders.
function rng(seedStr) {
  let h = 2166136261;
  for (const ch of seedStr) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
}
function metrics(k) {
  const cr = creator(k.creatorId), c = campaign(k.campaignId);
  const r = rng(k.id + k.creatorId);
  const reach = cr.followers * (cr.er / 100);
  const clicks = Math.round(reach * (0.18 + r() * 0.22));
  const codeUses = Math.round(clicks * (0.035 + r() * 0.04));
  const orders = codeUses + Math.round(clicks * (0.008 + r() * 0.01));
  const revenue = orders * c.price;
  const daily = Array.from({ length: 14 }, (_, i) => {
    const decay = Math.exp(-i / 5);
    return Math.round((clicks / 4.2) * decay * (0.7 + r() * 0.6));
  });
  const earning = (c.comp === 'fixed' ? c.amount : 0) + (c.comp === 'affiliate' ? revenue * c.amount / 100 : 0);
  return { clicks, codeUses, orders, revenue, cvr: clicks ? orders / clicks : 0, daily, earning, code: promo(cr) };
}

function Sparkline(data) {
  const w = 520, h = 150, p = 8, max = Math.max(1, ...data);
  const x = (i) => p + i * (w - p * 2) / (data.length - 1);
  const y = (v) => h - p - (v / max) * (h - p * 2 - 14);
  const line = data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `${p},${h - p} ${line} ${w - p},${h - p}`;
  const peak = data.indexOf(max);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Daily clicks, last 14 days">
    <polygon points="${area}" fill="var(--blush)" opacity=".7"/>
    <polyline points="${line}" fill="none" stroke="var(--rose)" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(peak)}" cy="${y(max)}" r="4" fill="var(--ink)"/>
    <text x="${Math.min(x(peak) + 8, w - 60)}" y="${y(max) - 6}" font-size="12" fill="var(--ink-2)" font-weight="600">${max.toLocaleString()}</text>
  </svg>
  <div class="row between xs muted"><span>Day 1 · post goes live</span><span>Day 14</span></div>`;
}

  apply: ({ id }) => { modal = { type: 'contract', mode: 'apply', campaignId: id, creatorId: S.me }; render(); },
  'accept-offer': ({ id }) => { const k = S.collabs.find((x) => x.id === id); modal = { type: 'contract', mode: 'accept', campaignId: k.campaignId, creatorId: k.creatorId, collabId: id }; render(); },
  'contract-view': ({ id }) => { const k = S.collabs.find((x) => x.id === id); modal = { type: 'contract', mode: 'view', campaignId: k.campaignId, creatorId: k.creatorId }; render(); },
  sign: () => {
    const errEl = $('#sign-err'), name = $('#sign').value.trim();
    const problems = [];
    if (!$('#agree-ftc').checked) problems.push('Confirm the FTC disclosure rules.');
    if (!$('#agree-usage').checked) problems.push('Agree to the usage rights.');
    if (name.length < 2) problems.push('Type your name to sign.');
    if (problems.length) { errEl.hidden = false; errEl.textContent = problems.join(' '); return; }
    const m = modal; modal = null;
    if (m.mode === 'offer') {
      update((s) => s.collabs.push({ id: uid('k'), campaignId: m.campaignId, creatorId: m.creatorId, stage: -1, via: 'offer', signedBrand: name }));
      toast((S.lang === 'ko' ? '제안을 보냈습니다 → ' : 'Offer sent to ') + creator(m.creatorId).name);
    } else if (m.mode === 'accept') {
      update((s) => { const k = s.collabs.find((x) => x.id === m.collabId); k.stage = 0; k.signedCreator = name; });
      toast('Offer accepted. The brand will ship your sample.');
    } else {
      update((s) => s.collabs.push({ id: uid('k'), campaignId: m.campaignId, creatorId: S.me, stage: 0, via: 'apply', signedCreator: name }));
      toast('Applied. Track it in My Collaborations.');
    }
  },
  approve: ({ id }) => {
    update((s) => { const k = s.collabs.find((x) => x.id === id); Object.assign(k, nextTracking(campaign(k.campaignId)), { stage: 1 }); });
    toast(S.role === 'brand' && S.lang === 'ko' ? '승인 완료 · 송장번호가 발급되었습니다' : 'Approved. Tracking number issued.');
  },
  'simulate-ship': ({ id }) => { actions.approve({ id }); },
  decline: ({ id }) => { update((s) => { s.collabs = s.collabs.filter((x) => x.id !== id); }); toast(S.lang === 'ko' && S.role === 'brand' ? '거절했습니다' : 'Removed.'); },
  received: ({ id }) => { update((s) => { s.collabs.find((x) => x.id === id).stage = 2; }); toast('Marked as delivered. Content is due next.'); },
  upload: ({ id }) => { modal = { type: 'upload', collabId: id }; render(); },
  'submit-content': () => {
    const url = $('#up-url').value.trim(), cap = $('#up-caption').value;
    const problems = [];
    if (!/^https?:\/\/(www\.)?(tiktok\.com|instagram\.com)\//i.test(url)) problems.push('Paste a TikTok or Instagram post URL.');
    if (!ftcOk(cap)) problems.push('Caption needs #ad or #sponsored in the first 125 characters.');
    if (!$('#up-label').checked) problems.push('Turn on the paid-partnership label.');
    if (!$('#up-verbal').checked) problems.push('Add a verbal disclosure.');
    if (!$('#up-claims').checked) problems.push('Confirm no medical claims.');
    if (problems.length) { const e = $('#up-err'); e.hidden = false; e.innerHTML = problems.map(esc).join('<br>'); return; }
    const id = modal.collabId; modal = null;
    update((s) => { const k = s.collabs.find((x) => x.id === id); k.stage = 3; k.post = url; k.caption = cap; });
    toast('FTC check passed. Collab completed ✓');
  },
  profile: ({ id }) => { modal = { type: 'profile', creatorId: id }; render(); },
  'edit-profile': () => { modal = null; update((s) => { s.tab.creator = 'profile'; }); window.scrollTo(0, 0); },
  like: ({ id }) => update((s) => { s.liked = s.liked.includes(id) ? s.liked.filter((x) => x !== id) : [...s.liked, id]; }),
  pitch: ({ id }) => { modal = { type: 'pitch', campaignId: id }; render(); },
  'send-pitch': () => {
    const msg = $('#pitch-msg').value.trim(), price = Number($('#pitch-price').value), sel = $('#pitch-pkg').value;
    const err = $('#pitch-err');
    if (msg.length < 20) { err.hidden = false; err.textContent = 'Give them one concrete scene (20+ characters).'; return; }
    if (!(price >= 0) || $('#pitch-price').value === '') { err.hidden = false; err.textContent = 'Set a price. Use 0 for product only.'; return; }
    const pk = profile(S.me).packages.filter((x) => x.name);
    const cid = $('#pitch-campaign').value;
    modal = null;
    update((s) => s.pitches.push({ id: uid('p'), creatorId: S.me, campaignId: cid, message: msg, pkg: sel === 'custom' ? 'Custom package' : pk[Number(sel)].name, price, status: 'pending', ts: Date.now() }));
    toast('Pitch sent to ' + campaign(cid).brand + '.');
  },
  'accept-pitch': ({ id }) => {
    update((s) => {
      const p = s.pitches.find((x) => x.id === id);
      p.status = 'accepted';
      s.collabs.push({ id: uid('k'), campaignId: p.campaignId, creatorId: p.creatorId, stage: 1, via: 'pitch', pitchPrice: p.price, ...nextTracking(campaign(p.campaignId)) });
    });
    toast(S.role === 'brand' && S.lang === 'ko' ? '역제안 수락 · 샘플 발송' : 'Pitch accepted. Sample shipped.');
  },
  'decline-pitch': ({ id }) => { update((s) => { s.pitches.find((x) => x.id === id).status = 'declined'; }); toast(S.lang === 'ko' ? '정중히 거절했습니다' : 'Declined politely.'); },
  note: ({ id }) => { modal = { type: 'note', collabId: id, rating: 5, tags: [], text: '' }; render(); },
  'note-star': ({ v }) => { modal.rating = Number(v); render(); },
  'note-tag': ({ v }) => { modal.tags = modal.tags.includes(v) ? modal.tags.filter((x) => x !== v) : [...modal.tags, v]; render(); },
  'save-note': () => {
    const m = modal; modal = null;
    update((s) => { s.collabs.find((x) => x.id === m.collabId).note = { rating: m.rating, text: (m.text || '').trim(), tags: m.tags, date: Date.now() }; });
    toast(S.lang === 'ko' ? '글로우 노트가 프로필에 게시되었습니다' : 'Glow Note published to their profile.');
  },
  'vibe-toggle': ({ v }) => update((s) => { const p = s.profiles[S.me]; p.vibe = p.vibe.includes(v) ? p.vibe.filter((x) => x !== v) : [...p.vibe, v]; }),
  'vibe-add': () => { const v = $('#vibe-custom').value.trim(); if (!v) return; update((s) => { const p = s.profiles[S.me]; if (!p.vibe.includes(v)) p.vibe.push(v); }); },
  'pkg-add': () => update((s) => { s.profiles[S.me].packages.push({ name: '', price: '' }); }),
  'pkg-del': ({ i }) => update((s) => { s.profiles[S.me].packages.splice(Number(i), 1); }),
  'photo-remove': () => update((s) => { s.profiles[S.me].photo = ''; }),
  'feed-filter': ({ v }) => update((s) => { s.feedFilter = v; }),
  'open-post': ({ id }) => { modal = { type: 'post', postId: id }; render(); },
  home: () => { modal = null; update((s) => { s.tab[s.role] = tabsFor(s.role)[0].id; }); window.scrollTo(0, 0); },
  'mod-filter': ({ v }) => update((s) => { s.modFilter = v; }),
  menu: ({ kind, id, parent }) => { modal = { type: 'menu', kind, id, parent, back: modal }; render(); },
  'item-edit': ({ kind, id, parent }) => { const o = findItem(kind, id, parent); modal = { type: 'edit', kind, id, parent, text: kind === 'comment' ? o.text : (o.caption || ''), back: modal && modal.back }; render(); },
  'item-save': () => {
    const { kind, id, parent } = modal, text = (modal.text || '').trim(), o = findItem(kind, id, parent);
    if (kind === 'comment' && !text) { const e = $('#edit-err'); e.hidden = false; e.textContent = 'A comment cannot be empty. Delete it instead.'; return; }
    if (kind === 'post' && !text && !o.img) { const e = $('#edit-err'); e.hidden = false; e.textContent = 'A post without a photo needs a caption.'; return; }
    const back = modal.back; modal = back && back.type === 'post' ? back : null;
    update(() => { if (kind === 'comment') o.text = text; else o.caption = text; o.edited = Date.now(); o.editedBy = isAdmin() && !owns(kind, o) ? 'admin' : 'owner'; });
    toast(S.lang === 'ko' && S.role !== 'creator' ? '수정했습니다' : 'Saved.');
  },
  'item-hide': ({ kind, id, parent }) => {
    const o = findItem(kind, id, parent), hide = !o.hidden;
    if (modal && modal.type === 'menu') { const back = modal.back; modal = back && back.type === 'post' ? back : null; }
    update(() => { o.hidden = hide; if (hide) o.reports = 0; });
    toast(S.lang === 'ko' ? (hide ? '숨겼습니다. 작성자와 운영자만 볼 수 있습니다.' : '숨김을 해제했습니다.') : (hide ? 'Hidden. Only the author and moderators can see it.' : 'Visible again.'));
  },
  'item-dismiss': ({ kind, id, parent }) => { const o = findItem(kind, id, parent); if (modal && modal.type === 'menu') modal = null; update(() => { o.reports = 0; }); toast(S.lang === 'ko' ? '신고를 기각했습니다' : 'Report dismissed.'); },
  'item-report': ({ kind, id, parent }) => { const o = findItem(kind, id, parent); modal = null; update((s) => { o.reports = (o.reports || 0) + 1; s.myReports.push(id); }); toast('Reported. A moderator will review it.'); },
  'item-delete': ({ kind, id, parent }) => { modal = { type: 'menu', kind, id, parent, confirm: true }; render(); },
  // Delete = move to archive. Nothing is lost until a moderator purges it.
  'item-delete-yes': ({ kind, id, parent }) => {
    const o = findItem(kind, id, parent);
    modal = null;
    update(() => { o.deleted = { ts: Date.now(), by: isAdmin() && !owns(kind, o) ? 'admin' : 'owner' }; });
    toast(S.role === 'creator' ? 'Deleted.' : S.lang === 'ko' ? '보관소로 옮겼습니다. 언제든 복구할 수 있습니다.' : 'Moved to archive. You can restore it any time.');
  },
  'item-restore': ({ kind, id, parent }) => {
    const o = findItem(kind, id, parent);
    update(() => { delete o.deleted; });
    toast(S.lang === 'ko' ? '복구했습니다. 원래 자리로 돌아갔습니다.' : 'Restored to its original place.');
  },
  'item-purge': ({ kind, id, parent }) => { modal = { type: 'menu', kind, id, parent, confirm: 'purge' }; render(); },
  'item-purge-yes': ({ kind, id, parent }) => {
    modal = null;
    update((s) => {
      if (kind === 'post') { s.posts = s.posts.filter((x) => x.id !== id); delete s.comments[id]; }
      else if (kind === 'comment') s.comments[parent] = (s.comments[parent] || []).filter((x) => x.id !== id);
    });
    toast(S.lang === 'ko' ? '영구 삭제했습니다.' : 'Deleted forever.');
  },
  compose: () => { modal = { type: 'compose', img: '', caption: '' }; render(); },
  'compose-clear': () => { modal.img = ''; render(); },
  'publish-post': () => {
    const caption = (modal.caption || '').trim();
    if (!modal.img && caption.length < 3) { const e = $('#post-err'); e.hidden = false; e.textContent = 'Add a photo or write a caption.'; return; }
    const palettes = [['#F6E1DA', '#E9B8A8'], ['#E3EBDF', '#B8CBB0'], ['#E1E8F0', '#B9C6DA'], ['#F6EED6', '#E4CF95'], ['#EFE4F2', '#CDB6D6']];
    const words = caption.replace(/#\S+/g, '').trim().split(/\s+/).slice(0, 3).join(' ') || 'New post';
    const post = { id: uid('po'), creatorId: S.me, img: modal.img, art: { g: palettes[Math.floor(Math.random() * palettes.length)], label: words }, caption, ts: Date.now(), likes: 0 };
    modal = null;
    update((s) => { s.posts.push(post); s.tab.creator = 'glow'; s.feedFilter = 'all'; });
    window.scrollTo(0, 0);
    toast('Posted to Glow Feed.');
  },
  account: () => { modal = { type: 'account' }; render(); },
  'switch-me': ({ id }) => { modal = null; update((s) => { s.me = id; }); toast('Signed in as ' + creator(id).name + '.'); },
  join: () => { modal = { type: 'join', platform: 'TikTok', skin: 'Combination', tone: 'Medium', photo: '' }; render(); },
  'join-submit': () => {
    const m = modal, err = $('#join-err');
    const handle = '@' + String(m.handle || '').replace(/^@+/, '').replace(/[^a-z0-9._]/gi, '').toLowerCase();
    const followers = Number(m.followers), er = Number(m.er);
    const problems = [];
    if (String(m.name || '').trim().length < 2) problems.push('Add your name.');
    if (handle.length < 4) problems.push('Add your handle.');
    else if (S.creators.some((c) => c.handle === handle)) problems.push(handle + ' is already on LinkGlow.');
    if (!(followers >= 1000)) problems.push('Followers must be 1,000 or more.');
    if (!(er > 0 && er <= 50)) problems.push('Engagement rate should be between 0.1 and 50.');
    if (String(m.city || '').trim().length < 2) problems.push('Add your city.');
    if (problems.length) { err.hidden = false; err.innerHTML = problems.map(esc).join('<br>'); return; }
    const hues = ['#F6E1DA', '#E3EBDF', '#E1E8F0', '#F6EED6', '#EFE4F2'];
    const fee = Math.max(100, Math.round(followers / 1000 * 7 / 10) * 10);
    const id = 'cr' + Date.now().toString(36);
    const cr = { id, name: m.name.trim(), handle, platform: m.platform, followers, er, niche: (m.niche || '').trim() || 'K-Beauty Routines', tone: m.tone, skin: m.skin, city: m.city.trim(), fee, hue: hues[S.creators.length % hues.length], isNew: true };
    modal = null;
    update((s) => {
      s.creators.push(cr);
      s.profiles[id] = { photo: m.photo || '', bio: (m.bio || '').trim(), vibe: [], packages: [{ name: m.platform === 'TikTok' ? 'TikTok video' : 'Reel', price: fee }, { name: 'Seeding · product only', price: 0 }], highlights: [] };
      s.me = id; s.role = 'creator'; s.tab.creator = 'profile';
    });
    window.scrollTo(0, 0);
    toast('Welcome, ' + cr.name.split(' ')[0] + '. Brands can find you now.');
  },
  close: () => { modal = null; render(); },
  'close-scrim': (_, el, e) => { if (e.target === el) actions.close(); },
  reset: () => { S = seed(); modal = null; save(); render(); toast('Demo reset.'); }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  actions[el.dataset.action]?.(el.dataset, el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.bind) {
    setPath(el.dataset.bind, el.value);
    if (el.dataset.bind.startsWith('draft.')) { delete S.draftErrors[el.dataset.bind.slice(6)]; }
    save();
    if (el.id.startsWith('d-')) refreshPreview();
    if (el.dataset.bind.startsWith('profiles.')) { const pv = $('#profile-preview'); if (pv) pv.innerHTML = ProfileBody(creator(S.me)); }
  }
  if (el.id === 'note-text' && modal) modal.text = el.value;
  if (el.dataset.m && modal) modal[el.dataset.m] = el.value;
  if (el.dataset.filter && el.tagName === 'INPUT') { setPath(el.dataset.filter, el.value); save(); render(); }
  if (el.id === 'up-caption') {
    const ok = ftcOk(el.value), live = $('#ftc-live');
    live.innerHTML = `<span class="dot ${ok ? 'ok' : ''}"></span><span>${ok ? 'Disclosure found up front ✓' : 'Add #ad or #sponsored in the first 125 characters'}</span>`;
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.filter && el.tagName === 'SELECT') { setPath(el.dataset.filter, el.value); save(); render(); }
  if (el.dataset.bind && el.tagName === 'SELECT') { setPath(el.dataset.bind, el.value); save(); render(); }
  if (el.id === 'pitch-pkg') { const x = profile(S.me).packages.filter((p) => p.name)[Number(el.value)]; if (x) $('#pitch-price').value = x.price; }
  if (el.dataset.m && modal) modal[el.dataset.m] = el.value;
  const file = el.files && el.files[0];
  if (el.id === 'photo-input' && file) loadImage(file, 320, 320, (url) => { update((s) => { s.profiles[s.me].photo = url; }); toast('Photo updated.'); });
  if (el.id === 'join-photo' && file) loadImage(file, 320, 320, (url) => { modal.photo = url; render(); });
  if (el.id === 'post-photo' && file) loadImage(file, 640, 800, (url) => { modal.img = url; render(); });
});
// Center-crop and downscale to a small JPEG so photos fit in localStorage.
function loadImage(file, w, h, done) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const scale = Math.min(img.width / w, img.height / h), sw = w * scale, sh = h * scale;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
    URL.revokeObjectURL(url);
    done(cv.toDataURL('image/jpeg', 0.8));
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('That file is not an image.'); };
  img.src = url;
}
document.addEventListener('submit', (e) => {
  if (e.target.classList.contains('comment-form')) {
    e.preventDefault();
    const id = e.target.dataset.collab, text = e.target.querySelector('input').value.trim();
    if (!text) return;
    const by = S.role === 'brand' ? 'brand' : S.role === 'admin' ? 'admin' : S.me;
    update((s) => { (s.comments[id] = s.comments[id] || []).push({ id: uid('m'), by, name: asName(), text, ts: Date.now() }); });
    return;
  }
  if (e.target.id !== 'create-form') return;
  e.preventDefault();
  const d = S.draft, errs = {};
  if (!d.product.trim()) errs.product = 1;
  if (!d.skin.length) errs.skin = 1;
  if (d.comp !== 'seeding' && !(Number(d.amount) > 0)) errs.amount = 1;
  if (!(Number(d.price) > 0)) errs.price = 1;
  if (!d.deadline) errs.deadline = 1;
  if (Object.keys(errs).length) { update((s) => { s.draftErrors = errs; }); return toast(t('Required') + ' ✱'); }
  const c = {
    id: uid('c'), brand: d.brand.trim() || ME_BRAND, product: d.product.trim(), category: d.category, skin: d.skin.slice(),
    concerns: d.concerns.length ? d.concerns.slice() : ['Dryness'], comp: d.comp, amount: Number(d.amount) || 0, price: Number(d.price),
    slots: Math.max(1, Number(d.slots) || 1), ship: d.ship, shipFrom: d.shipFrom.trim() || 'Seoul, Korea', days: Number(d.days) || 9,
    notes: d.notes.trim(), brief: d.brief.trim(), deadline: d.deadline, created: -Date.now() // newest first in feed
  };
  update((s) => { s.campaigns.push(c); s.draft = blankDraft(); s.draftErrors = {}; s.tab.brand = 'campaigns'; s.offerCampaign = c.id; });
  window.scrollTo(0, 0);
  toast(t('Campaign published. Live on the US creator feed.'));
});
// Live preview refresh without re-rendering the form (keeps keyboard open on mobile).
function refreshPreview() {
  const holder = $('#create-form')?.nextElementSibling;
  if (!holder) return;
  const card = holder.querySelector('article');
  const d = S.draft;
  const tmp = document.createElement('div');
  tmp.innerHTML = CampaignCard({ ...d, id: 'preview', product: d.product || (S.lang === 'ko' ? '제품명을 입력하세요' : 'Your product name'), amount: Number(d.amount) || 0, price: Number(d.price) || 0, slots: Number(d.slots) || 0 }, true);
  card.replaceWith(tmp.firstElementChild);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal) actions.close(); });

render();
</script>
<footer class="foot">
  LinkGlow prototype · mock data · <button class="link" data-action="reset" style="font-size:12px">Reset demo</button>
</footer>
